flow:
  name: standard-build
  version: 1
  start: plan
  description: plan -> build -> review (with rework loop) -> push -> pentest

human_channel:
  transport: ntfy
  topic: fleet-orchestrator

workspace:
  strategy: git-worktree
  base_branch: main
  task_branch: "task/{task_id}"
  remote: origin

# Gate commands are project-specific. The planner emits them per task as gates.json
# in the workspace (keys: build, tests, lint, standards), which the engine runs and
# which take precedence over anything here. This static block is only a fallback for
# gate names the planner didn't define; uncomment to set repo-wide defaults, e.g.:
# gate_commands:
#   build: "npm run build"
#   tests: "npm test"
#   lint: "npm run lint"
#   standards: "./scripts/standards-check.sh"

bindings:
  planner:   { agent: claude-desktop, model: claude-opus-4-8, effort: high }
  builder:   { agent: opencode,       model: deepseek/deepseek-chat }
  reviewer:  { agent: codex,          model: gpt-5.6-terra }
  pentester: { agent: hermes,         model: deepseek-v4 }

nodes:
  - id: plan
    role: planner
    instruction: templates/plan.md
    produces: [spec.md, acceptance_tests.md, gates.json]
    on_pass: approve_plan
    on_fail: { route: plan, max_iterations: 0, on_exhausted: escalate }

  - id: approve_plan
    type: human_gate
    prompt: "Plan ready. Approve spec to start automatic build?"
    options: { approve: build, edit_spec: plan, abort: end }

  - id: build
    role: builder
    instruction: templates/build.md
    inputs: [spec.md, acceptance_tests.md, review_notes.md]
    on_pass: review
    on_fail: { route: build, max_iterations: 3, on_exhausted: escalate }

  - id: review
    role: reviewer
    instruction: templates/review.md
    inputs: [spec.md, acceptance_tests.md]
    produces: [review.json]
    verdict_file: review.json
    gates: [build, tests, lint, standards]
    on_pass: decide_next
    on_fail: { route: build, carry: review_notes.md, max_iterations: 3, on_exhausted: escalate }

  - id: decide_next
    type: human_gate
    prompt: "Review passed. What now?"
    options: { push: push, pentest_first: pentest, both: pentest, hold: end }
    default: both

  - id: pentest
    role: pentester
    instruction: templates/pentest.md
    inputs: [spec.md]
    produces: [pentest.json]
    verdict_file: pentest.json
    on_pass: push
    on_fail: { route: build, carry: review_notes.md, max_iterations: 2, on_exhausted: escalate }

  - id: push
    type: action
    run: git_push
    on_pass: end

escalate:
  notify: human_channel
  await: [retry, reassign, take_over, abort]
